services:
  mongo:
    image: mongo:7
    container_name: doctor-app-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
      MONGO_INITDB_DATABASE: doctor_appointments
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
